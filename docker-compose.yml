services:
  db:
    image: postgres:16-alpine
    container_name: suporte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: suporte
      POSTGRES_USER: suporte
      POSTGRES_PASSWORD: suporte
    ports:
      - "5432:5432"
    volumes:
      - suporte-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suporte -d suporte"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: suporte-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/suporte
      DB_USER: suporte
      DB_PASSWORD: suporte
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-min-32-caracteres}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      FORKIFY_BASE_URL: ${FORKIFY_BASE_URL:-https://forkify-api.herokuapp.com/api/search}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: suporte-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  suporte-db-data:
