server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: suporte-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/suporte}
    username: ${DB_USER:suporte}
    password: ${DB_PASSWORD:suporte}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # sem fallback de proposito: sem JWT_SECRET definida, a aplicacao nao sobe
    # (nenhum segredo fica versionado no repositorio, nem em dev)
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  forkify:
    base-url: ${FORKIFY_BASE_URL:https://forkify-api.herokuapp.com/api/search}
    timeout-ms: ${FORKIFY_TIMEOUT_MS:5000}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

logging:
  level:
    com.alfa.suporte: INFO
